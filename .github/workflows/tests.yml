name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        # sqlite: ONE_app__databaseUrl stays unset, tests fall back to sqlite::memory:
        backend: [sqlite, mariadb]

    steps:
      - uses: actions/checkout@v5

      - name: Start MariaDB
        if: matrix.backend == 'mariadb'
        run: |
          docker run -d --name mariadb -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root_password \
            -e MYSQL_DATABASE=core_db \
            mariadb:12.0.2
          # mariadb:12 ships only the mariadb-* binaries; the mysql* aliases are gone.
          for i in $(seq 1 60); do
            if docker exec mariadb healthcheck.sh --connect --innodb_initialized; then
              break
            fi
            if [ "$i" = 60 ]; then
              docker logs mariadb
              echo "Timed out waiting for MariaDB" >&2
              exit 1
            fi
            sleep 2
          done
          docker exec mariadb mariadb -uroot -proot_password -e "SET GLOBAL max_connections = 1000;"
          echo "ONE_app__databaseUrl=mysql://root:root_password@127.0.0.1:3306/core_db" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
          rustc --version

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ matrix.backend }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.backend }}-

      - name: Run tests
        run: cargo test --workspace
