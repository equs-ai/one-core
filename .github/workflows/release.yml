name: release

on:
  push:
    tags:
      - "*/v[0-9]+.[0-9]+.[0-9]+"
      - "*/v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to rehearse, as it appears in Cargo.toml
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
          rustc --version

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Resolve the crate
        id: crate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="${{ inputs.crate }}"
            want=""
          else
            name="${GITHUB_REF_NAME%/v*}"
            want="${GITHUB_REF_NAME##*/v}"
          fi
          metadata=$(cargo metadata --no-deps --format-version 1)
          read -r version manifest <<<"$(jq -r --arg n "$name" \
            '.packages[] | select(.name == $n) | "\(.version) \(.manifest_path)"' <<<"$metadata")"
          if [ -z "$manifest" ]; then
            echo "::error::no crate named $name in this workspace"
            jq -r '"  " + .packages[].name' <<<"$metadata" | sort
            exit 1
          fi
          echo "crate    $name"
          echo "version  $version"
          echo "manifest $manifest"
          if [ -n "$want" ] && [ "$version" != "$want" ]; then
            echo "::error::tag says $want, $name is $version"
            exit 1
          fi
          {
            echo "name=$name"
            echo "manifest=$manifest"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --verbose -p "${{ steps.crate.outputs.name }}"

      - name: Pack and verify
        run: cargo package --verbose --manifest-path "${{ steps.crate.outputs.manifest }}"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.EQUS_CREDENTIALS_SDK_CRATES_IO_TOKEN }}
        run: cargo publish --verbose --manifest-path "${{ steps.crate.outputs.manifest }}"
